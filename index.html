<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statzilla</title>
<style>
:root{color-scheme:light dark;--bg:#fbfaf7;--ink:#1d1b26;--muted:#5b5866;--accent:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#0d1030;--ink:#f3efe6;--muted:#b9b5c8;--accent:#ffc65c}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:2rem;margin:0 0 4px}
p{color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Statzilla</h1>
<p>Jocuri mici pentru Android.</p>
<h2>Turnul</h2>
<p>Clădește cel mai înalt turn, bloc cu bloc, sub cerul înstelat.<br>
<a href="https://ambidextru.github.io/turnul-privacy/">Politica de confidențialitate</a></p>
</main>
</body>
</html>
